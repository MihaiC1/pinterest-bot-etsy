name: Pinterest Automation Bot

on:
  schedule:
    - cron: '0 8 * * *' # Rulează automat în fiecare zi la 08:00 UTC
  workflow_dispatch: # Îți permite să dai trigger manual din interfață

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pinterest script
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: |
          python bot.py
